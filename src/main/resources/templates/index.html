<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Início')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container">
    <div class="card">
        <h1>Bem-vindo ao Thindesk Chamados</h1>
        <p class="texto-suave">
            Sistema de controle de chamados técnicos: abra um chamado, acompanhe o atendimento
            e veja os indicadores no dashboard.
        </p>

        <!-- Visitante -->
        <div sec:authorize="isAnonymous()">
            <a th:href="@{/login}" class="btn">Entrar</a>
            <a th:href="@{/cadastro}">Criar uma conta</a>
        </div>

        <!-- Logado -->
        <div sec:authorize="isAuthenticated()">
            <a th:href="@{/dashboard}" class="btn">Ir para o dashboard</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
